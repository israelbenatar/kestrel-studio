<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "EB Garamond"; src: url(assets/EBGaramond-Regular.ttf); font-style: normal; }
      @font-face { font-family: "EB Garamond"; src: url(assets/EBGaramond-Italic.ttf); font-style: italic; }
      @font-face { font-family: "Inter"; src: url(assets/Inter-Regular.ttf); font-weight: 400; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #F5F0E8; }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden;
        background: radial-gradient(120% 80% at 50% 38%, #FBF7F0 0%, #F5F0E8 55%, #EDE4D6 100%); }
      /* photo cards in real 3D: depth sets size, blur (depth of field) and drift */
      #stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 42%; }
      .ph { position: absolute; width: 300px; height: 380px; border-radius: 14px; overflow: hidden;
        background: #fff; padding: 10px 10px 34px; box-shadow: 0 18px 40px rgba(60, 40, 30, .22);
        transform-style: preserve-3d; will-change: transform, filter; }
      .ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
      #p1 { left: 70px;  top: 140px; }
      #p2 { left: 720px; top: 110px; }
      #p3 { left: 40px;  top: 860px; }
      #p4 { left: 740px; top: 880px; }
      #p5 { left: 390px; top: 960px; }
      /* a soft veil so the type always reads over the cards */
      #veil { position: absolute; left: 90px; right: 90px; top: 430px; height: 440px; border-radius: 40px;
        background: radial-gradient(closest-side, rgba(250, 246, 239, .96), rgba(250, 246, 239, .82) 60%, rgba(250, 246, 239, 0)); }
      .line { position: absolute; left: 0; width: 100%; text-align: center; font-family: "EB Garamond", serif;
        font-size: 96px; line-height: 1; color: #2D3436; will-change: filter, transform, opacity; }
      #l1 { top: 500px; }
      #l2 { top: 612px; font-style: italic;
        background: linear-gradient(100deg, #9A6550 0%, #C5A035 48%, #B07A64 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        background-size: 220% 100%; }
      #sub { position: absolute; left: 0; width: 100%; top: 770px; text-align: center;
        font-family: "Inter", sans-serif; font-size: 32px; color: #6E6862; letter-spacing: .01em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1350">
      <div id="stage" class="clip" data-start="0" data-duration="2.6" data-track-index="0">
        <div id="p1" class="ph"><img src="assets/sea-01.jpg" /></div>
        <div id="p2" class="ph"><img src="assets/city-11.jpg" /></div>
        <div id="p3" class="ph"><img src="assets/win-15.jpg" /></div>
        <div id="p4" class="ph"><img src="assets/bday-02.jpg" /></div>
        <div id="p5" class="ph"><img src="assets/hike-20.jpg" /></div>
      </div>
      <div id="veil" class="clip" data-start="0" data-duration="2.6" data-track-index="1"></div>
      <div id="l1" class="line clip" data-start="0" data-duration="2.6" data-track-index="2">One album.</div>
      <div id="l2" class="line clip" data-start="0" data-duration="2.6" data-track-index="3">Any order you like.</div>
      <div id="sub" class="clip" data-start="0" data-duration="2.6" data-track-index="4">Just ask the Sustain chat.</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // cards: arrive from deep z, each at its own depth; far ones stay blurred (depth of field)
      const cards = [
        ["#p1", -380, -14, 8, 4], ["#p2", -520, 12, -6, 6], ["#p3", -260, -8, -10, 3],
        ["#p4", -460, 10, 7, 5], ["#p5", -160, 4, 3, 1.5],
      ];
      cards.forEach(([id, z, ry, rz, blur], i) => {
        tl.fromTo(id, { z: z - 700, rotationY: ry * 2.2, rotationZ: rz * 1.6, opacity: 0, filter: "blur(18px)" },
          { z, rotationY: ry, rotationZ: rz, opacity: 1, filter: `blur(${blur}px)`, duration: 1.3, ease: "power3.out" }, 0.05 * i);
        tl.to(id, { z: z + 90, rotationY: ry * 0.6, duration: 1.3, ease: "none" }, 1.3);   // slow drift toward camera
      });
      tl.fromTo("#veil", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#l1", { opacity: 0, y: 24, filter: "blur(16px)", letterSpacing: "0.12em" },
        { opacity: 1, y: 0, filter: "blur(0px)", letterSpacing: "0em", duration: 0.9, ease: "power3.out" }, 0.15);
      tl.fromTo("#l2", { opacity: 0, y: 24, filter: "blur(16px)", backgroundPosition: "100% 0" },
        { opacity: 1, y: 0, filter: "blur(0px)", backgroundPosition: "0% 0", duration: 1.1, ease: "power3.out" }, 0.65);
      tl.fromTo("#sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
