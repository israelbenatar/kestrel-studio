<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* global 4.0–12.0 of the launch film: the prompt is typed, then the real site unfolds in 3D and
         lands flat at exactly the rectangle where kestrel takes over (x 40, y 300, 1000 x 625) */
      @font-face { font-family: "Inter Tight"; src: url(assets/InterTight-SemiBold.ttf); font-weight: 600; }
      @font-face { font-family: "Inter Tight"; src: url(assets/InterTight-Regular.ttf); font-weight: 400; }
      @font-face { font-family: "JetBrains Mono"; src: url(assets/JetBrainsMono-Medium.ttf); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0E0F13; }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden;
        background: url(assets/aurora.png) 0 0 / 1080px 1350px; }
      /* an orb behind the terminal so its glass has something to refract */
      #orb { position: absolute; left: 560px; top: 380px; width: 420px; height: 420px; border-radius: 50%;
        background: #E8743B; filter: blur(80px); opacity: .45; }
      .glass { position: absolute; border-radius: 30px;
        background: linear-gradient(135deg, rgba(255,246,236,.13), rgba(255,246,236,.05));
        backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
        box-shadow: 0 24px 60px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.30), inset 0 0 0 1px rgba(255,240,225,.16); }
      #term { left: 80px; top: 470px; width: 920px; height: 360px; padding: 30px 40px; transform-origin: 50% 0; }
      #term .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
      #term .bar i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.2); }
      #term .bar span { margin-left: 14px; font: 500 22px "JetBrains Mono"; color: #8A847C; letter-spacing: .02em; }
      #line { font: 500 38px/1.5 "JetBrains Mono"; color: #F2EEE8; }
      #line b { color: #F5B544; font-weight: 500; }
      #caret { display: inline-block; width: 20px; height: 42px; background: #F5B544; vertical-align: -6px; margin-left: 4px; }
      #enter { position: absolute; right: 36px; bottom: 30px; padding: 10px 18px; border-radius: 999px;
        font: 500 22px "JetBrains Mono"; color: #1A0F08; background: linear-gradient(100deg,#F5B544,#E8743B); opacity: 0; }
      #stage { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 20%; }
      #site { position: absolute; left: 40px; top: 300px; width: 1000px; height: 625px; border-radius: 18px;
        background: url(assets/hero.png) 0 0 / 1000px 625px; transform-origin: 50% 100%;
        box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,240,225,.18); }   /* = art.shadow() */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1350">
      <div id="orb" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="stage" class="clip" data-start="0" data-duration="8" data-track-index="1"><div id="site"></div></div>
      <div id="term" class="glass clip" data-start="0" data-duration="8" data-track-index="2">
        <div class="bar"><i></i><i></i><i></i><span>your agent · kestrel-video skill</span></div>
        <div id="line"><b>you ›</b> <span id="typed"></span><span id="caret"></span></div>
        <div id="enter">⏎ enter</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const text = "Make a 30-second LinkedIn launch video for kestrel studio. Take the look from our site.";
      const tl = gsap.timeline({ paused: true });
      const typed = document.getElementById("typed");
      // the terminal lands on the beat (global 4.0)
      tl.fromTo("#term", { opacity: 0, y: 60, scale: .94 }, { opacity: 1, y: 0, scale: 1, duration: .6, ease: "back.out(1.5)" }, 0);
      // typing at a readable 1x pace, driven by the timeline so every frame is deterministic
      const state = { n: 0 };
      tl.to(state, { n: text.length, duration: 2.9, ease: "none", onUpdate: () => { typed.textContent = text.slice(0, Math.round(state.n)); } }, .55);
      tl.set("#caret", { opacity: 0 }, 3.7); tl.set("#caret", { opacity: 1 }, 3.95);
      // enter on global 8.0
      tl.fromTo("#enter", { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .25, ease: "back.out(2)" }, 3.75);
      tl.to("#enter", { scale: .92, duration: .08, yoyo: true, repeat: 1 }, 4.0);
      // the terminal lifts away; the site unfolds from a steep tilt and lands flat on global 12.0
      tl.to("#term", { y: -520, scale: .62, opacity: 0, duration: 1.0, ease: "power3.in" }, 4.1);
      tl.to("#orb", { opacity: 0, duration: 2.6 }, 4.1);   // gone by the hand-off: kestrel continues on the bare aurora
      tl.fromTo("#site", { opacity: 0, rotationX: 68, y: 260, z: -420 },
        { opacity: 1, rotationX: 0, y: 0, z: 0, duration: 3.2, ease: "power3.out" }, 4.6);
      tl.fromTo("#site", { opacity: 0 }, { opacity: 1, duration: .6, ease: "none" }, 4.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
